name: .NET CI — MedCare HelpDesk Build & Test

on:
  push:
    branches: [ "main", "master", "feature/**", "docs/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run MedCare xUnit Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Restore NuGet Dependencies
        run: dotnet restore "MedCare HelpDesk/MedCare HelpDesk.slnx"

      - name: 4. Build Solution (Release)
        run: dotnet build "MedCare HelpDesk/MedCare HelpDesk.slnx" --no-restore --configuration Release

      - name: 5. Run MedCare HelpDesk xUnit Tests
        run: dotnet test "MedCare HelpDesk/MedCare HelpDesk.slnx" --no-build --configuration Release --verbosity normal
